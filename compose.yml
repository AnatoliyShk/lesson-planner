services:
  app:
    build: .
    ports: ["${APP_PORT:-8765}:8765"]
    volumes: [".:/app"]
    depends_on: [db]
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-cake}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db/${MYSQL_DATABASE:-cake}?encoding=utf8mb4&timezone=UTC"
  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    ports: ["${MYSQL_PORT:-3308}:3306"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cake}
      MYSQL_USER: ${MYSQL_USER:-cake}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["dbdata:/var/lib/mysql"]
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"      # web UI
volumes:
  dbdata:
